<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Ekle</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 2rem; background: #f4f4f5; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 250px; padding: 15px; margin-bottom: 15px; font-family: inherit; border: 2px solid #000; box-sizing: border-box; }
        button { padding: 12px 24px; background: #000; color: #fff; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Toplu Guest Ekle</h1>
    <p>Her satıra bir isim gelecek şekilde listeyi yapıştırın:</p>
    <textarea id="guestList" placeholder="Ahmet Yılmaz&#10;Ayşe Demir&#10;..."></textarea>
    <button onclick="addGuests()">Veritabanına Ekle</button>
    <div id="status"></div>

    <script>
        // KENDİ BİLGİLERİNİ BURAYA GİR
        const supabaseUrl = 'https://fmcfcnqqqjjpoomqised.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtY2ZjbnFxcWpqcG9vbXFpc2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzQ3MTIsImV4cCI6MjEwODYxMDcxMn0.1C7SeDvYI2K9iDO3LLRsaHbFXD2Cz9T7M6dSw26pIVs';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function addGuests() {
            const text = document.getElementById('guestList').value;
            const status = document.getElementById('status');
            
            // Satırları ayır, sağ/sol boşlukları temizle, boş olanları filtrele
            const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);

            if(names.length === 0) {
                status.innerText = "Lütfen en az bir isim girin.";
                return;
            }
            
            status.innerText = "Yükleniyor...";

            // Supabase'in istediği formata (array of objects) çevir
            const insertData = names.map(name => ({ name: name, is_arrived: false }));

            const { error } = await supabase.from('guests').insert(insertData);
            
            if(error) {
                status.innerText = "Hata: " + error.message;
            } else {
                status.innerText = `${names.length} kişi başarıyla eklendi!`;
                document.getElementById('guestList').value = ''; // Kutuyu temizle
            }
        }
    </script>
</body>
</html>
