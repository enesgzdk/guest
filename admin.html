<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA ADMIN PANEL</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { nova: '#ff5500', dark: '#09090b', card: '#18181b', bordercol: '#27272a' },
                    fontFamily: { bebas: ['"Bebas Neue"', 'sans-serif'], inter: ['"Inter"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="antialiased p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        <h1 class="text-nova font-bebas text-6xl tracking-wide mb-10 text-center">NOVA ADMIN</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            
            <!-- Tekli Ekleme -->
            <div class="bg-card border border-bordercol rounded-3xl p-8 shadow-2xl">
                <h2 class="text-xl font-semibold mb-6">Misafir Ekle</h2>
                <input type="text" id="singleName" placeholder="Örn: Ahmet Yılmaz" autocomplete="off"
                    class="w-full bg-dark border border-bordercol rounded-xl px-4 py-3.5 mb-4 outline-none focus:border-nova transition-colors">
                <button onclick="addSingleGuest()" 
                    class="w-full bg-nova text-black font-semibold text-lg py-3.5 rounded-xl hover:bg-orange-600 transition-colors active:scale-95">
                    Listeye Ekle
                </button>
                <div id="singleStatus" class="mt-4 text-center text-sm font-medium h-5"></div>
            </div>

            <!-- Toplu Ekleme -->
            <div class="bg-card border border-bordercol rounded-3xl p-8 shadow-2xl">
                <h2 class="text-xl font-semibold mb-2">Toplu Liste Aktar</h2>
                <p class="text-zinc-500 text-sm mb-4">Her satıra bir isim. Boşluklar otomatik temizlenir.</p>
                <textarea id="bulkNames" placeholder="Ayşe Demir&#10;Mehmet Kaya..."
                    class="w-full h-32 bg-dark border border-bordercol rounded-xl px-4 py-3.5 mb-4 outline-none focus:border-nova transition-colors resize-none"></textarea>
                <button onclick="addBulkGuests()" 
                    class="w-full bg-zinc-100 text-black font-semibold text-lg py-3.5 rounded-xl hover:bg-white transition-colors active:scale-95">
                    Tümünü Aktar
                </button>
                <div id="bulkStatus" class="mt-4 text-center text-sm font-medium h-5"></div>
            </div>
        </div>

        <!-- Liste Yönetimi -->
        <div class="bg-card border border-bordercol rounded-3xl p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Mevcut Liste</h2>
                <span class="bg-dark border border-bordercol px-4 py-1.5 rounded-full text-zinc-400 font-medium text-sm">
                    <span id="totalCount" class="text-white">0</span> Kayıt
                </span>
            </div>
            
            <div class="max-h-[500px] overflow-y-auto pr-2 flex flex-col gap-2" id="adminGuestList">
                <div class="text-center text-zinc-500 py-10 animate-pulse">Liste yükleniyor...</div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://fmcfcnqqqjjpoomqised.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtY2ZjbnFxcWpqcG9vbXFpc2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzQ3MTIsImV4cCI6MjEwODYxMDcxMn0.1C7SeDvYI2K9iDO3LLRsaHbFXD2Cz9T7M6dSw26pIVs';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function loadAdminGuests() {
            const listDiv = document.getElementById('adminGuestList');
            const { data, error } = await db.from('guests').select('*').order('id', { ascending: false });
            
            if(error) return listDiv.innerHTML = `<div class="text-red-500 p-4 text-center">Hata: ${error.message}</div>`;
            
            document.getElementById('totalCount').innerText = data.length;
            listDiv.innerHTML = '';
            
            if(data.length === 0) return listDiv.innerHTML = '<div class="text-zinc-500 text-center py-10">Henüz kimse eklenmemiş.</div>';

            data.forEach(guest => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-4 bg-dark border border-bordercol rounded-xl hover:border-zinc-700 transition-colors';
                
                const badge = guest.is_arrived 
                    ? `<span class="ml-3 px-2.5 py-0.5 rounded-md bg-nova/10 text-nova border border-nova/20 text-xs font-bold tracking-wide">GELDİ</span>` 
                    : '';

                item.innerHTML = `
                    <div class="flex items-center">
                        <span class="text-zinc-200 font-medium">${guest.name}</span>
                        ${badge}
                    </div>
                    <button onclick="deleteGuest(${guest.id})" class="p-2 text-zinc-500 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-colors" title="Sil">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                listDiv.appendChild(item);
            });
        }

        function showStatus(elementId, message, isError = false) {
            const el = document.getElementById(elementId);
            el.className = `mt-4 text-center text-sm font-medium h-5 ${isError ? 'text-red-500' : 'text-green-400'}`;
            el.innerText = message;
            setTimeout(() => el.innerText = '', 3000);
        }

        async function addSingleGuest() {
            const nameInput = document.getElementById('singleName');
            const name = nameInput.value.trim();

            if(!name) return showStatus('singleStatus', 'Lütfen bir isim girin.', true);
            
            document.getElementById('singleStatus').innerText = "Ekleniyor...";
            const { error } = await db.from('guests').insert([{ name: name, is_arrived: false }]);
            
            if(error) return showStatus('singleStatus', `Hata: ${error.message}`, true);
            
            showStatus('singleStatus', 'Başarıyla eklendi!');
            nameInput.value = '';
            loadAdminGuests();
        }

        async function addBulkGuests() {
            const text = document.getElementById('bulkNames').value;
            const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);

            if(names.length === 0) return showStatus('bulkStatus', 'Lütfen geçerli isimler girin.', true);
            
            document.getElementById('bulkStatus').innerText = "Yükleniyor...";
            
            // Chunking: Eğer liste çok uzunsa Supabase API limitine takılmamak için
            const insertData = names.map(name => ({ name: name, is_arrived: false }));
            const { error } = await db.from('guests').insert(insertData);
            
            if(error) return showStatus('bulkStatus', `Hata: ${error.message}`, true);
            
            showStatus('bulkStatus', `${names.length} kişi eklendi!`);
            document.getElementById('bulkNames').value = '';
            loadAdminGuests();
        }

        async function deleteGuest(id) {
            if(!confirm("Bu misafiri silmek istediğinize emin misiniz?")) return;
            const { error } = await db.from('guests').delete().eq('id', id);
            if(error) alert("Silinirken hata: " + error.message);
            else loadAdminGuests();
        }

        loadAdminGuests();
    </script>
</body>
</html>
