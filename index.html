<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Guest</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #121212; color: #eee; padding: 20px; max-width: 600px; margin: auto; }
        .header { position: sticky; top: 0; background: #121212; padding-bottom: 15px; border-bottom: 2px solid #ff5500; z-index: 10; }
        h1 { color: #ff5500; margin-bottom: 5px; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; box-sizing: border-box; font-size: 16px; border-radius: 6px; }
        input[type="text"]:focus { outline: none; border-color: #ff5500; }
        #stats { font-weight: bold; margin-bottom: 10px; font-size: 1.1em; color: #ccc; }
        
        #guestContainer { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        
        .guest-item { 
            display: flex; align-items: center; padding: 15px; 
            background: #1e1e1e; border: 1px solid #333; border-radius: 6px;
            order: 0; transition: opacity 0.2s, background 0.2s, border-color 0.2s;
        }
        
        .guest-item.arrived { opacity: 0.4; order: 1; background: #111; border-color: #222; }
        .guest-item label { flex-grow: 1; margin-left: 12px; cursor: pointer; font-size: 16px; font-weight: 500; }
        
        /* Turuncu Checkbox Customization */
        .guest-item input[type="checkbox"] { 
            appearance: none; width: 24px; height: 24px; background: #333; 
            border-radius: 4px; cursor: pointer; position: relative; border: 1px solid #555;
        }
        .guest-item input[type="checkbox"]:checked { background: #ff5500; border-color: #ff5500; }
        .guest-item input[type="checkbox"]:checked::after {
            content: '✔'; position: absolute; color: white; font-size: 16px; 
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nova Guest</h1>
        <div id="stats">Gelen: 0 / Toplam: 0</div>
        <input type="text" id="searchInput" placeholder="İsim ara..." onkeyup="filterGuests()">
    </div>
    
    <div id="guestContainer">Veriler çekiliyor...</div>

    <script>
        const supabaseUrl = 'https://fmcfcnqqqjjpoomqised.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtY2ZjbnFxcWpqcG9vbXFpc2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzQ3MTIsImV4cCI6MjEwODYxMDcxMn0.1C7SeDvYI2K9iDO3LLRsaHbFXD2Cz9T7M6dSw26pIVs';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allGuests = [];

        async function loadGuests() {
            const container = document.getElementById('guestContainer');
            const { data, error } = await supabase.from('guests').select('*').order('name', { ascending: true });
            
            if (error) return container.innerHTML = "Hata oluştu: " + error.message;
            allGuests = data; renderGuests();
        }

        function renderGuests() {
            const container = document.getElementById('guestContainer');
            container.innerHTML = ''; 
            
            allGuests.forEach(guest => {
                const div = document.createElement('div');
                div.className = `guest-item ${guest.is_arrived ? 'arrived' : ''}`;
                div.setAttribute('data-name', guest.name.toLowerCase());
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = guest.is_arrived;
                checkbox.id = 'guest_' + guest.id;
                checkbox.onchange = (e) => toggleStatus(guest.id, e.target.checked, div);
                
                const label = document.createElement('label');
                label.htmlFor = 'guest_' + guest.id;
                label.innerText = guest.name;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
            });
            updateStats();
        }

        async function toggleStatus(id, isArrived, element) {
            isArrived ? element.classList.add('arrived') : element.classList.remove('arrived');
            const guestIndex = allGuests.findIndex(g => g.id === id);
            if(guestIndex > -1) allGuests[guestIndex].is_arrived = isArrived;
            updateStats();
            await supabase.from('guests').update({ is_arrived: isArrived }).eq('id', id);
        }

        function filterGuests() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.guest-item').forEach(item => {
                item.getAttribute('data-name').includes(query) ? item.classList.remove('hidden') : item.classList.add('hidden');
            });
        }

        function updateStats() {
            document.getElementById('stats').innerText = `Gelen: ${allGuests.filter(g => g.is_arrived).length} / Toplam: ${allGuests.length}`;
        }

        loadGuests();
    </script>
</body>
</html>
