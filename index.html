<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA GUEST</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --card: #18181b; --accent: #ff5500; --text: #f4f4f5; --text-muted: #a1a1aa; --border: #27272a; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; padding: 0 20px; }
        .header { position: sticky; top: 0; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(12px); padding: 20px 0 15px; border-bottom: 1px solid var(--border); z-index: 10; margin-bottom: 20px; }
        h1 { font-family: 'Bebas Neue', sans-serif; color: var(--accent); font-size: 2.8rem; margin: 0 0 5px 0; letter-spacing: 2px; }
        .stats { font-weight: 500; font-size: 0.95rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 16px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 1rem; border-radius: 12px; outline: none; transition: all 0.2s; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.15); }
        #guestContainer { display: flex; flex-direction: column; gap: 10px; }
        .guest-item { display: flex; align-items: center; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; order: 0; transition: all 0.3s ease; }
        .guest-item.arrived { opacity: 0.4; order: 1; background: var(--bg); border-color: transparent; }
        .guest-item label { flex-grow: 1; margin-left: 16px; cursor: pointer; font-size: 1.1rem; font-weight: 500; }
        
        /* Custom UI Checkbox */
        .checkbox-wrapper { position: relative; display: inline-block; width: 28px; height: 28px; }
        .checkbox-wrapper input { opacity: 0; width: 0; height: 0; position: absolute; }
        .checkmark { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg); border: 2px solid var(--border); border-radius: 8px; transition: .2s; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .checkbox-wrapper input:checked ~ .checkmark { background-color: var(--accent); border-color: var(--accent); }
        .checkmark::after { content: ""; display: none; width: 6px; height: 12px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .checkbox-wrapper input:checked ~ .checkmark::after { display: block; }
        .hidden { display: none !important; }
        .loader { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>NOVA GUEST</h1>
            <div class="stats">
                <span id="statsText">Gelen: 0 / Toplam: 0</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="İsim ara..." autocomplete="off" onkeyup="filterGuests()">
            </div>
        </div>
    </div>
    
    <div class="container" id="guestContainer">
        <div class="loader">Veriler yükleniyor...</div>
    </div>

    <script>
        const supabaseUrl = 'https://fmcfcnqqqjjpoomqised.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtY2ZjbnFxcWpqcG9vbXFpc2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzQ3MTIsImV4cCI6MjEwODYxMDcxMn0.1C7SeDvYI2K9iDO3LLRsaHbFXD2Cz9T7M6dSw26pIVs';
        
        // SYNTAX ERROR BURADA ÇÖZÜLDÜ (supabase değişken ismi db yapıldı)
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let allGuests = [];

        async function loadGuests() {
            const container = document.getElementById('guestContainer');
            const { data, error } = await db.from('guests').select('*').order('name', { ascending: true });
            
            if (error) { container.innerHTML = `<div class="loader">Hata: ${error.message}</div>`; return; }
            allGuests = data; renderGuests();
        }

        function renderGuests() {
            const container = document.getElementById('guestContainer');
            container.innerHTML = ''; 
            
            allGuests.forEach(guest => {
                const div = document.createElement('div');
                div.className = `guest-item ${guest.is_arrived ? 'arrived' : ''}`;
                div.setAttribute('data-name', guest.name.toLowerCase());
                
                const cbWrapper = document.createElement('label');
                cbWrapper.className = 'checkbox-wrapper';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = guest.is_arrived;
                checkbox.id = 'guest_' + guest.id;
                checkbox.onchange = (e) => toggleStatus(guest.id, e.target.checked, div);
                
                const checkmark = document.createElement('span');
                checkmark.className = 'checkmark';
                
                cbWrapper.appendChild(checkbox);
                cbWrapper.appendChild(checkmark);
                
                const textLabel = document.createElement('label');
                textLabel.htmlFor = 'guest_' + guest.id;
                textLabel.innerText = guest.name;
                
                div.appendChild(cbWrapper);
                div.appendChild(textLabel);
                container.appendChild(div);
            });
            updateStats();
        }

        async function toggleStatus(id, isArrived, element) {
            isArrived ? element.classList.add('arrived') : element.classList.remove('arrived');
            const guestIndex = allGuests.findIndex(g => g.id === id);
            if(guestIndex > -1) allGuests[guestIndex].is_arrived = isArrived;
            updateStats();
            await db.from('guests').update({ is_arrived: isArrived }).eq('id', id);
        }

        function filterGuests() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.guest-item').forEach(item => {
                item.getAttribute('data-name').includes(query) ? item.classList.remove('hidden') : item.classList.add('hidden');
            });
        }

        function updateStats() {
            document.getElementById('statsText').innerText = `Gelen: ${allGuests.filter(g => g.is_arrived).length} / Toplam: ${allGuests.length}`;
        }

        loadGuests();
    </script>
</body>
</html>
