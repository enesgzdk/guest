<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA GUEST</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { nova: '#ff5500', dark: '#09090b', card: '#18181b', bordercol: '#27272a' },
                    fontFamily: { bebas: ['"Bebas Neue"', 'sans-serif'], inter: ['"Inter"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; -webkit-tap-highlight-color: transparent; }
        .guest-item { order: 0; transition: all 0.3s ease; }
        .guest-item.arrived { order: 1; opacity: 0.4; }
    </style>
</head>
<body class="antialiased pb-20">

    <div class="sticky top-0 z-50 bg-dark/80 backdrop-blur-xl border-b border-bordercol px-5 py-4 mb-6">
        <div class="max-w-xl mx-auto">
            <div class="flex justify-between items-end mb-4">
                <h1 class="text-nova font-bebas text-5xl tracking-wide leading-none m-0">NOVA</h1>
                <div id="statsText" class="text-zinc-400 font-medium text-sm pb-1">Gelen: 0 / 0</div>
            </div>
            <div class="relative">
                <input type="text" id="searchInput" autocomplete="off" onkeyup="filterGuests()" placeholder="Misafir ara..." 
                    class="w-full bg-card border border-bordercol text-white placeholder-zinc-500 rounded-xl px-4 py-3.5 outline-none focus:border-nova focus:ring-1 focus:ring-nova transition-all shadow-inner text-base">
            </div>
        </div>
    </div>
    
    <div class="max-w-xl mx-auto px-5 flex flex-col gap-3" id="guestContainer">
        <div class="text-center text-zinc-500 py-10 animate-pulse">Listeler senkronize ediliyor...</div>
    </div>

    <script>
        const supabaseUrl = 'https://fmcfcnqqqjjpoomqised.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtY2ZjbnFxcWpqcG9vbXFpc2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzQ3MTIsImV4cCI6MjEwODYxMDcxMn0.1C7SeDvYI2K9iDO3LLRsaHbFXD2Cz9T7M6dSw26pIVs';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let allGuests = [];

        async function loadGuests() {
            const container = document.getElementById('guestContainer');
            const { data, error } = await db.from('guests').select('*').order('name', { ascending: true });
            
            if (error) { container.innerHTML = `<div class="text-red-500 text-center">Bağlantı Hatası: ${error.message}</div>`; return; } allGuests = data; renderGuests(); }  function renderGuests() { const container = document.getElementById('guestContainer'); container.innerHTML = '';  allGuests.forEach(guest => { const div = document.createElement('div'); div.className = `guest-item ${guest.is_arrived ? 'arrived' : ''}`;
                div.setAttribute('data-name', guest.name.toLowerCase());
                
                const beerCount = guest.beer_count || 0;
                const beerBadge = beerCount > 0 
                    ? `<span class="ml-auto mr-4 flex items-center gap-1.5 px-3 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-500 rounded-lg font-bold text-sm tracking-wide shadow-[0_0_10px_rgba(245,158,11,0.1)]">🍺 ${beerCount} BİRA</span>` 
                    : '<span class="ml-auto"></span>';

                div.innerHTML = `
                    <label class="flex items-center cursor-pointer p-4 bg-card hover:bg-zinc-800/50 border border-bordercol rounded-2xl transition-colors">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" class="peer hidden" id="guest_${guest.id}" ${guest.is_arrived ? 'checked' : ''} onchange="toggleStatus(${guest.id}, this.checked, this.closest('.guest-item'))">
                            <div class="w-7 h-7 rounded-lg border-2 border-zinc-600 peer-checked:bg-nova peer-checked:border-nova transition-all flex items-center justify-center">
                                <svg class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                        </div>
                        <span class="ml-4 text-lg font-medium text-zinc-100 select-none">${guest.name}</span>${beerBadge}
                    </label>
                `;
                container.appendChild(div);
            });
            updateStats();
        }

        async function toggleStatus(id, isArrived, element) {
            isArrived ? element.classList.add('arrived') : element.classList.remove('arrived');
            const guestIndex = allGuests.findIndex(g => g.id === id);
            if(guestIndex > -1) allGuests[guestIndex].is_arrived = isArrived;
            updateStats();
            await db.from('guests').update({ is_arrived: isArrived }).eq('id', id);
        }

        function filterGuests() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.guest-item').forEach(item => {
                item.style.display = item.getAttribute('data-name').includes(query) ? 'flex' : 'none';
            });
        }

        function updateStats() {
            document.getElementById('statsText').innerText = `Gelen: ${allGuests.filter(g => g.is_arrived).length} / Toplam:${allGuests.length}`;
        }

        loadGuests();
    </script>
</body>
</html>
